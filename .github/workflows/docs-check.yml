name: Documentation checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the manuscript
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test the checker
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check internal Markdown links and inventory references
        run: python3 scripts/check_docs.py --inventory
