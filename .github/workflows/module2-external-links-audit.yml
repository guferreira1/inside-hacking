name: Module II external link audit

on:
  push:
    branches:
      - audit/module2-double-check-20260928

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Run permanent documentation checks
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 scripts/check_docs.py

      - name: Check Module II Markdown hygiene
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, sys

          files = sorted(Path("book/modulo-2").rglob("*.md"))
          issues = []
          for p in files:
              text = p.read_text(encoding="utf-8")
              for n, line in enumerate(text.splitlines(), 1):
                  if line.rstrip() != line:
                      issues.append((str(p), n, "trailing whitespace", line))
                  if "\t" in line:
                      issues.append((str(p), n, "tab character", line))
                  if re.search(r"(?<! ) {2,}(?! )", line) and not line.startswith("    "):
                      # Markdown tables/code alignment can contain deliberate spaces;
                      # only report prose-like lines without pipes/backticks.
                      if "|" not in line and "`" not in line:
                          issues.append((str(p), n, "repeated spaces", line))
                  m = re.search(r"\b([A-Za-zÀ-ÿ]{3,})\s+\1\b", line, re.I)
                  if m:
                      issues.append((str(p), n, "repeated word", line))

          print(f"markdown_files={len(files)}")
          if issues:
              for item in issues:
                  print("HYGIENE", *item, sep=" | ")
              sys.exit(1)
          print("markdown_hygiene=ok")
          PY

      - name: Validate external URLs referenced by Module II
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import re, urllib.request, urllib.error, ssl, sys, socket

          urls = set()
          pattern = re.compile(r'https://[^\s)>\]"}]+')
          for p in Path("book/modulo-2").rglob("*.md"):
              text = p.read_text(encoding="utf-8")
              for u in pattern.findall(text):
                  urls.add(u.rstrip('.,;:'))

          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; inside-hacking-link-audit/1.0)",
              "Range": "bytes=0-0",
              "Accept": "*/*",
          }

          def check(url):
              req = urllib.request.Request(url, headers=headers, method="GET")
              try:
                  with urllib.request.urlopen(req, timeout=20, context=ssl.create_default_context()) as r:
                      return (url, r.status, r.geturl(), "ok")
              except urllib.error.HTTPError as e:
                  if e.code in (401, 403, 405, 429):
                      return (url, e.code, e.geturl(), "access-controlled")
                  if e.code in (404, 410):
                      return (url, e.code, e.geturl(), "broken")
                  if 500 <= e.code <= 599:
                      return (url, e.code, e.geturl(), "transient")
                  return (url, e.code, e.geturl(), "http-error")
              except (urllib.error.URLError, socket.timeout, TimeoutError, ssl.SSLError) as e:
                  return (url, None, "", "network-error:" + type(e).__name__)
              except Exception as e:
                  return (url, None, "", "error:" + type(e).__name__)

          results = []
          with ThreadPoolExecutor(max_workers=10) as ex:
              futs = [ex.submit(check, u) for u in sorted(urls)]
              for f in as_completed(futs):
                  results.append(f.result())

          rank = {"broken":0, "http-error":1, "transient":2, "network-error":3, "access-controlled":4, "ok":5}
          results.sort(key=lambda x: (rank.get(x[3].split(":")[0], 3), x[0]))

          counts = {}
          for url, status, final, kind in results:
              key = kind.split(":")[0]
              counts[key] = counts.get(key, 0) + 1
              print(f"{kind:20} {str(status):>4} {url} -> {final}")

          print("SUMMARY", "unique_urls="+str(len(urls)), " ".join(f"{k}={v}" for k,v in sorted(counts.items())))
          broken = [r for r in results if r[3] in ("broken", "http-error")]
          if broken:
              sys.exit(2)
          PY
