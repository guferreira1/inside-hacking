name: Prepare chapter 15
on:
  push:
    branches:
      - docs/chapter-15-permissions-20260929
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify manuscript and prepare an unreferenced tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .editorial_prepare15.py
